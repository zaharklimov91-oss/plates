name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: mkdir -p www && cp "$(ls *.html | head -1)" www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Полный экран без часов и процентов
        run: |
          f=android/app/src/main/res/values/styles.xml
          perl -0pi -e 's#(<style name="AppTheme\.NoActionBar[A-Za-z]*"[^>]*>)#$1\n        <item name="android:windowFullscreen">true</item>#g' $f
      - name: Иконка
        run: |
          f="$(ls *.png *.jpg *.jpeg 2>/dev/null | head -1)"
          if [ -n "$f" ]; then
            mkdir -p assets && cp "$f" "assets/icon.${f##*.}"
            npm install --no-save @capacitor/assets
            npx capacitor-assets generate --android --iconBackgroundColor '#0a0e1a'
          fi
      - run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
