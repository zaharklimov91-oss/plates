name: build-mobile

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: mkdir -p www && cp "$(ls *.html | head -1)" www/index.html
      - run: npm ci
      - run: '[ -d android ] || npx cap add android'
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - working-directory: android
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/release/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: mkdir -p www && cp "$(ls *.html | head -1)" www/index.html
      - run: npm ci
      - run: '[ -d ios ] || npx cap add ios'
      - run: npx cap sync ios
      - name: Archive (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -archivePath $RUNNER_TEMP/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        run: |
          mkdir -p $RUNNER_TEMP/ipa/Payload
          cp -R $RUNNER_TEMP/App.xcarchive/Products/Applications/App.app $RUNNER_TEMP/ipa/Payload/
          cd $RUNNER_TEMP/ipa && zip -qr App.ipa Payload
          mkdir -p $GITHUB_WORKSPACE/out && cp App.ipa $GITHUB_WORKSPACE/out/
      - uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: out/App.ipa
