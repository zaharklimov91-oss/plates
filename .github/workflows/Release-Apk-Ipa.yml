name: Release-Apk-Ipa

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Prepare web assets
        run: mkdir -p www && cp "$(ls *.html | head -1)" www/index.html

      - name: Install deps
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Fullscreen + portrait
        run: |
          f=android/app/src/main/res/values/styles.xml
          perl -0pi -e 's#(<style name="AppTheme\.NoActionBar[A-Za-z]*"[^>]*>)#$1\n        <item name="android:windowFullscreen">true</item>#g' $f
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: App icon
        run: |
          f="$(ls *.png *.jpg *.jpeg 2>/dev/null | head -1)"
          if [ -n "$f" ]; then
            mkdir -p assets && cp "$f" "assets/icon.${f##*.}"
            npm install --no-save @capacitor/assets
            npx capacitor-assets generate --android --iconBackgroundColor '#0a0e1a'
          fi

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Sync web + pods
        run: |
          mkdir -p www
          cp "$(ls *.html | head -1)" www/index.html
          npx cap sync ios
          cd ios/App && pod install

      - name: Import certificate (best effort)
        continue-on-error: true
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KP=$(printf '%s' "${KEYCHAIN_PASSWORD:-}" | tr -d '\r\n'); [ -n "$KP" ] || KP=ci-pass
          printf '%s' "$P12_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/c.p12" || exit 0
          security create-keychain -p "$KP" "$KC" || exit 0
          security set-keychain-settings -lut 21600 "$KC" || true
          security unlock-keychain -p "$KP" "$KC" || exit 0
          security list-keychains -d user -s "$KC" login.keychain-db || true
          PASS=$(printf '%s' "${P12_PASSWORD:-}" | tr -d '\r\n')
          for cand in "$PASS" ""; do
            security import "$RUNNER_TEMP/c.p12" -k "$KC" -P "$cand" -T /usr/bin/codesign >/dev/null 2>&1 && break
          done
          security set-key-partition-list -S apple-tool:,apple:,system: -s -k "$KP" "$KC" >/dev/null 2>&1 || true
          ID=$(security find-identity -v -p codesigning "$KC" | grep -oE '[A-F0-9]{40}' | head -1 || true)
          echo "identity: ${ID:-none}"
          [ -n "${ID:-}" ] || exit 0
          printf '%s' "$MOBILEPROVISION_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/p.mobileprovision" || exit 0
          UUID=$(security cms -D -i "$RUNNER_TEMP/p.mobileprovision" | plutil -extract UUID raw - 2>/dev/null || true)
          NAME=$(security cms -D -i "$RUNNER_TEMP/p.mobileprovision" | plutil -extract Name raw - 2>/dev/null || true)
          [ -n "$UUID" ] || exit 0
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/p.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          { echo "KC=$KC"; echo "IDENTITY=$ID"; echo "PNAME=$NAME";
            echo "BUNDLE_ID=$(node -p "require('./capacitor.config.json').appId")"; } >> $GITHUB_ENV
          echo "SIGNED_READY=1" >> $GITHUB_ENV

      - name: Archive
        run: |
          set -o pipefail
          if [ "${SIGNED_READY:-0}" = "1" ]; then
            echo "== signed archive =="
            if xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
                 -sdk iphoneos -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
                 CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$IDENTITY" \
                 PROVISIONING_PROFILE_SPECIFIER="$PNAME" \
                 OTHER_CODE_SIGN_FLAGS="--keychain $KC" 2>&1 | tail -12; then
              echo "SIGNED=1" >> $GITHUB_ENV
              exit 0
            fi
            echo "== signed failed, unsigned fallback =="
            rm -rf "$RUNNER_TEMP/App.xcarchive"
          fi
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -12

      - name: Package IPA
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          if [ "${SIGNED:-0}" = "1" ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              '<key>method</key><string>development</string>' \
              '<key>signingStyle</key><string>manual</string>' \
              "<key>signingCertificate</key><string>$IDENTITY</string>" \
              "<key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PNAME</string></dict>" \
              '</dict></plist>' > exp.plist
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist exp.plist 2>&1 | tail -12 || true
            ls "$RUNNER_TEMP/export/"*.ipa >/dev/null 2>&1 && cp "$RUNNER_TEMP/export/"*.ipa "$GITHUB_WORKSPACE/build/App-signed.ipa"
          fi
          if ! ls "$GITHUB_WORKSPACE/build/"*.ipa >/dev/null 2>&1; then
            APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
            [ -d "$APP" ] || { echo "App.app missing"; exit 1; }
            mkdir -p "$RUNNER_TEMP/ipa/Payload"
            cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
            ( cd "$RUNNER_TEMP/ipa" && zip -qry App.ipa Payload )
            cp "$RUNNER_TEMP/ipa/App.ipa" "$GITHUB_WORKSPACE/build/App-unsigned.ipa"
          fi
          ls -lh "$GITHUB_WORKSPACE/build/"

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/*.ipa
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: |
          [ -n "${KC:-}" ] && security delete-keychain "$KC" 2>/dev/null || true
          true

  release:
    needs: [apk, ipa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect files
        run: |
          mkdir -p out
          find dist -name '*.apk' -exec cp {} out/NomeraRF.apk \;
          find dist -name '*.ipa' -exec cp {} out/NomeraRF.ipa \;
          ls -lh out/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: НОМЕРА РФ — release ${{ github.run_number }}
          body: |
            Сборка APK + IPA.

            - `NomeraRF.apk` — Android (debug)
            - `NomeraRF.ipa` — iOS (unsigned, если секреты подписи не сработали)
          files: out/*
          draft: false
          prerelease: false
