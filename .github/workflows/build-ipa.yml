name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare web directory
        run: |
          mkdir -p www
          HTML_FILE=$(ls *.html 2>/dev/null | head -1)
          if [ -n "$HTML_FILE" ]; then
            cp "$HTML_FILE" www/index.html
          else
            echo "<html><body>App</body></html>" > www/index.html
          fi

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Create iOS project
        run: |
          if [ -d ios ]; then
            echo "✓ ios/ folder exists, syncing..."
            npx cap sync ios
          else
            echo "Creating iOS project..."
            # Use npx cap add with environment variables to avoid interactive prompts
            npx @capacitor/cli add ios --web-dir=www < /dev/null 2>&1 || {
              # If cap add fails, the ios folder may still be partially created
              if [ ! -d ios/App/App.xcworkspace ]; then
                echo "ERROR: Failed to create iOS project"
                echo "Please run locally: npx cap add ios && git commit ios/"
                exit 1
              fi
            }
          fi
          
          # Final verification
          if [ ! -f "ios/App/App.xcworkspace/contents.xcworkspacedata" ]; then
            echo "ERROR: xcworkspace not properly configured"
            exit 1
          fi

      - name: Configure signing certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_DB="${{ runner.temp }}/build.keychain-db"
          
          echo "$P12_BASE64" | base64 --decode > cert.p12
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_DB"
          security default-keychain -s "$KEYCHAIN_DB"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_DB"
          
          security import cert.p12 -k "$KEYCHAIN_DB" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,system: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_DB"
          
          echo "KEYCHAIN_DB=$KEYCHAIN_DB" >> $GITHUB_ENV
          rm -f cert.p12

      - name: Configure provisioning profile
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > profile.mobileprovision
          
          PROFILE_UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i profile.mobileprovision | plutil -extract Name raw -)
          
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          
          echo "PROFILE_UUID=${PROFILE_UUID}" >> $GITHUB_ENV
          echo "PROFILE_NAME=${PROFILE_NAME}" >> $GITHUB_ENV
          rm -f profile.mobileprovision

      - name: Build archive
        run: |
          xcodebuild -workspace "ios/App/App.xcworkspace" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "${{ runner.temp }}/App.xcarchive" \
            archive \
            -allowProvisioningUpdates \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PROFILE_NAME }}" \
            CODE_SIGN_IDENTITY="Apple Development"

      - name: Export IPA
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath "${{ runner.temp }}/App.xcarchive" \
            -exportPath "${{ runner.temp }}/export" \
            -exportOptionsPlist ExportOptions.plist
          
          mkdir -p build
          cp "${{ runner.temp }}/export/App.ipa" build/App.ipa
          ls -lh build/App.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/App.ipa
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          KEYCHAIN_DB="${{ runner.temp }}/build.keychain-db"
          [ -n "$KEYCHAIN_DB" ] && security delete-keychain "$KEYCHAIN_DB" 2>/dev/null || true
