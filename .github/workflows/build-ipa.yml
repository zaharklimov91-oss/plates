name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Prep
        run: |
          mkdir -p www
          ls *.html | head -1 | xargs -I {} cp {} www/index.html || echo '<html><body>App</body></html>' > www/index.html
          npm install --legacy-peer-deps

      - name: Generate iOS
        run: |
          if [ ! -d ios ]; then
            npx @capacitor/cli add ios --web-dir=www < /dev/null 2>&1 || true
          fi
          [ -d ios/App/App.xcworkspace ] || { echo "Failed to create iOS project"; exit 1; }

      - name: Certs
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC="${{ runner.temp }}/build.keychain-db"
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import cert.p12 -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,system: -s -k "$KEYCHAIN_PASSWORD" "$KC"
          echo "KC=$KC" >> $GITHUB_ENV
          rm cert.p12

      - name: Profile
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > p.mobileprovision
          UUID=$(security cms -D -i p.mobileprovision | plutil -extract UUID raw -)
          NAME=$(security cms -D -i p.mobileprovision | plutil -extract Name raw -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp p.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "PNAME=$NAME" >> $GITHUB_ENV
          rm p.mobileprovision

      - name: Build
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath "${{ runner.temp }}/App.xcarchive" archive \
            -allowProvisioningUpdates PROVISIONING_PROFILE_SPECIFIER="${{ env.PNAME }}" \
            CODE_SIGN_IDENTITY="Apple Development"

      - name: Export
        run: |
          cat > /tmp/exp.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>development</string><key>signingStyle</key><string>automatic</string><key>stripSwiftSymbols</key><true/><key>compileBitcode</key><false/></dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "${{ runner.temp }}/App.xcarchive" \
            -exportPath "${{ runner.temp }}/export" -exportOptionsPlist /tmp/exp.plist
          mkdir -p build && cp "${{ runner.temp }}/export/App.ipa" build/App.ipa

      - uses: actions/upload-artifact@v4
        with: { name: app-ipa, path: build/App.ipa, if-no-files-found: error }

      - name: Cleanup
        if: always()
        run: security delete-keychain "${{ env.KC }}" 2>/dev/null || true
