name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install JS deps
        run: npm install --legacy-peer-deps

      - name: Sync web assets
        run: |
          mkdir -p www
          cp "$(ls *.html | head -1)" www/index.html
          npx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: |
          pod --version || sudo gem install cocoapods
          pod install

      - name: Import certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC="${{ runner.temp }}/build.keychain-db"
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import cert.p12 -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,system: -s -k "$KEYCHAIN_PASSWORD" "$KC"
          echo "KC=$KC" >> $GITHUB_ENV
          rm cert.p12

      - name: Import provisioning profile
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > p.mobileprovision
          UUID=$(security cms -D -i p.mobileprovision | plutil -extract UUID raw -)
          NAME=$(security cms -D -i p.mobileprovision | plutil -extract Name raw -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp p.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PNAME=$NAME" >> $GITHUB_ENV
          echo "BUNDLE_ID=$(node -p "require('./capacitor.config.json').appId")" >> $GITHUB_ENV
          rm p.mobileprovision

      - name: Archive
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -archivePath "${{ runner.temp }}/App.xcarchive" archive \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PNAME }}" \
            -allowProvisioningUpdates

      - name: Export IPA
        run: |
          cat > exp.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Development</string>
            <key>provisioningProfiles</key><dict>
              <key>${{ env.BUNDLE_ID }}</key><string>${{ env.PNAME }}</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "${{ runner.temp }}/App.xcarchive" \
            -exportPath "${{ runner.temp }}/export" -exportOptionsPlist exp.plist
          mkdir -p build && cp "${{ runner.temp }}/export/"*.ipa build/App.ipa

      - uses: actions/upload-artifact@v4
        with: { name: app-ipa, path: build/App.ipa, if-no-files-found: error }

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "${{ env.KC }}" 2>/dev/null || true
