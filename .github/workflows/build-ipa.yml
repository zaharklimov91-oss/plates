name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Sync web + pods
        run: |
          mkdir -p www
          cp "$(ls *.html | head -1)" www/index.html
          npx cap sync ios
          cd ios/App && pod install

      - name: Signing setup (optional)
        id: sign
        continue-on-error: true
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          set -u
          KC="$RUNNER_TEMP/build.keychain-db"
          KP=$(printf '%s' "${KEYCHAIN_PASSWORD:-}" | tr -d '\r\n'); [ -n "$KP" ] || KP=ci-pass
          PASS=$(printf '%s' "${P12_PASSWORD:-}" | tr -d '\r\n')

          printf '%s' "$P12_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/c.p12"
          [ -s "$RUNNER_TEMP/c.p12" ] || { echo "empty P12_BASE64"; exit 1; }

          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db

          OK=0
          for cand in "$PASS" ""; do
            if security import "$RUNNER_TEMP/c.p12" -k "$KC" -P "$cand" -T /usr/bin/codesign >/dev/null 2>&1; then OK=1; break; fi
          done
          if [ "$OK" -eq 0 ]; then
            for p in "$PASS" ""; do
              if openssl pkcs12 -legacy -in "$RUNNER_TEMP/c.p12" -nodes -passin "pass:$p" -out "$RUNNER_TEMP/x.pem" 2>/dev/null && grep -q BEGIN "$RUNNER_TEMP/x.pem"; then
                openssl pkcs12 -legacy -export -in "$RUNNER_TEMP/x.pem" -out "$RUNNER_TEMP/n.p12" -passout pass:rewrap
                security import "$RUNNER_TEMP/n.p12" -k "$KC" -P rewrap -T /usr/bin/codesign >/dev/null 2>&1 && { OK=1; break; }
              fi
            done
          fi
          [ "$OK" = "1" ] || { echo "P12 import failed (wrong P12_PASSWORD secret?) -> unsigned build"; exit 1; }

          security set-key-partition-list -S apple-tool:,apple:,system: -s -k "$KP" "$KC" >/dev/null 2>&1 || true
          ID=$(security find-identity -v -p codesigning "$KC" | grep -o '"Apple [^"]*"' | head -1 | tr -d '"')
          [ -n "$ID" ] || { echo "no codesigning identity"; exit 1; }

          printf '%s' "$MOBILEPROVISION_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/p.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/p.mobileprovision" >/dev/null 2>&1 || { echo "bad profile"; exit 1; }
          UUID=$(security cms -D -i "$RUNNER_TEMP/p.mobileprovision" | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$RUNNER_TEMP/p.mobileprovision" | plutil -extract Name raw -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/p.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "OK: identity=$ID profile=$NAME"
          {
            echo "KC=$KC"
            echo "IDENTITY=$ID"
            echo "PNAME=$NAME"
            echo "BUNDLE_ID=$(node -p "require('./capacitor.config.json').appId")"
          } >> $GITHUB_ENV
          echo "signed=1" >> $GITHUB_OUTPUT

      - name: Archive
        run: |
          SIG=""
          if [ "${{ steps.sign.outputs.signed }}" = "1" ]; then
            SIG="CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=$IDENTITY PROVISIONING_PROFILE_SPECIFIER=$PNAME OTHER_CODE_SIGN_FLAGS=--keychain=$KC"
          else
            SIG="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="
          fi
          echo "signing args: $SIG"
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -archivePath "$RUNNER_TEMP/App.xcarchive" archive $SIG 2>&1 | tail -20 \
            || { echo "== signed archive failed, retrying unsigned =="; \
                 xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
                   -sdk iphoneos -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
                   CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -20; \
                 echo "signed=0" >> $GITHUB_ENV; }

      - name: Package IPA
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          if [ "${signed:-0}" = "1" ] && [ -d "$RUNNER_TEMP/App.xcarchive" ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              "<key>method</key><string>development</string>" \
              "<key>signingStyle</key><string>manual</string>" \
              "<key>signingCertificate</key><string>$IDENTITY</string>" \
              "<key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PNAME</string></dict>" \
              '</dict></plist>' > exp.plist
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist exp.plist 2>&1 | tail -15 || true
          fi

          APP=""
          for c in "$RUNNER_TEMP/export/App.ipa" "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"; do
            [ -e "$c" ] && APP="$c" && break
          done
          [ -n "$APP" ] || { echo "Nothing to package"; ls -R "$RUNNER_TEMP/App.xcarchive/Products" 2>/dev/null; exit 1; }

          if [ "${APP##*.}" = "ipa" ]; then
            cp "$APP" "$GITHUB_WORKSPACE/build/App-signed.ipa"
          else
            mkdir -p "$RUNNER_TEMP/ipa/Payload"
            cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
            ( cd "$RUNNER_TEMP/ipa" && zip -qry App.ipa Payload )
            cp "$RUNNER_TEMP/ipa/App.ipa" "$GITHUB_WORKSPACE/build/App-unsigned.ipa"
          fi
          ls -lh "$GITHUB_WORKSPACE/build/"

      - uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/*.ipa
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: |
          [ -n "${KC:-}" ] && security delete-keychain "$KC" 2>/dev/null || true
          true
