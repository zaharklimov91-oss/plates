name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & prepare Capacitor iOS
        run: |
          npm install
          mkdir -p www && cp "$(ls *.html | head -1)" www/index.html
          [ -d ios ] || npx cap add ios
          npx cap sync ios

      - name: Archive (unsigned)
        run: |
          WS=$(ls -d ios/App/*.xcworkspace | head -n1)
          xcodebuild -workspace "$WS" -scheme App -configuration Release -sdk iphoneos \
            -archivePath $RUNNER_TEMP/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p $RUNNER_TEMP/ipa/Payload
          cp -R $RUNNER_TEMP/App.xcarchive/Products/Applications/App.app $RUNNER_TEMP/ipa/Payload/
          cd $RUNNER_TEMP/ipa && zip -qr App.ipa Payload
          mkdir -p build && cp App.ipa build/App.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/App.ipa
