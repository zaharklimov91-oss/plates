name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps --no-save

      - name: Create www directory with index.html
        run: |
          mkdir -p www
          ls *.html 2>/dev/null | head -1 | xargs -I {} cp {} www/index.html || {
            echo "<!DOCTYPE html><html><body>App</body></html>" > www/index.html
          }

      - name: Check if ios folder exists
        run: |
          if [ ! -d ios ]; then
            echo "ERROR: ios folder not found. This project needs to be set up with 'npx cap add ios' locally first."
            exit 1
          fi

      - name: Sync Capacitor iOS
        run: npx cap sync ios 2>&1 || true

      - name: Find and build xcworkspace
        run: |
          WS=$(find ios -name "*.xcworkspace" -type d | head -1)
          if [ -z "$WS" ]; then
            echo "ERROR: No xcworkspace found in ios directory"
            ls -la ios/
            exit 1
          fi
          echo "Found workspace: $WS"
          
          xcodebuild -workspace "$WS" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/App.xcarchive"
          APP_PATH="$ARCHIVE_PATH/Products/Applications/App.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app not found at $APP_PATH"
            ls -la "$ARCHIVE_PATH/Products/Applications/" 2>&1 || echo "Applications dir not found"
            exit 1
          fi
          
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          
          cd "$RUNNER_TEMP/ipa"
          zip -qr App.ipa Payload
          
          mkdir -p "$GITHUB_WORKSPACE/build"
          cp App.ipa "$GITHUB_WORKSPACE/build/App.ipa"
          
          echo "IPA created successfully"
          ls -lh "$GITHUB_WORKSPACE/build/App.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/App.ipa
          if-no-files-found: error
