name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm install --legacy-peer-deps

      - name: Sync web assets
        run: |
          mkdir -p www
          cp "$(ls *.html | head -1)" www/index.html
          npx cap sync ios
          cd ios/App && pod install

      - name: Import certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -u
          KC="$RUNNER_TEMP/build.keychain-db"
          PASS=$(printf '%s' "$P12_PASSWORD" | tr -d '\r\n')
          printf '%s' "$P12_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/cert.p12" 2>/dev/null \
            || printf '%s' "$P12_BASE64" | tr -d '\r\n' | base64 -D -o "$RUNNER_TEMP/cert.p12"
          ls -l "$RUNNER_TEMP/cert.p12"
          head -c 4 "$RUNNER_TEMP/cert.p12" | xxd

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db

          OK=0
          try() {
            echo "== trying import with password '$1'"
            if security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$1" -T /usr/bin/codesign -T /usr/bin/security 2>&1; then
              echo "IMPORT OK"; return 0
            fi
            return 1
          }

          try "$PASS" && OK=1
          if [ $OK -eq 0 ] && [ -n "$PASS" ]; then try "" && OK=1; fi

          if [ $OK -eq 0 ]; then
            echo "== direct import failed, trying openssl rewrite"
            for p in "$PASS" ""; do
              if openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -nodes -passin "pass:$p" -out "$RUNNER_TEMP/cert.pem" 2>/dev/null && grep -q "BEGIN" "$RUNNER_TEMP/cert.pem"; then
                echo "== openssl opened p12 with password '$p'"
                openssl pkcs12 -export -in "$RUNNER_TEMP/cert.pem" -out "$RUNNER_TEMP/re.p12" -passout pass:ci
                try "ci" && { OK=1; break; }
              fi
            done
          fi

          if [ $OK -eq 0 ]; then
            echo "== legacy openssl mode"
            for p in "$PASS" ""; do
              if openssl pkcs12 -legacy -in "$RUNNER_TEMP/cert.p12" -nodes -passin "pass:$p" -out "$RUNNER_TEMP/l.pem" 2>/dev/null && grep -q "BEGIN" "$RUNNER_TEMP/l.pem"; then
                openssl pkcs12 -export -legacy -in "$RUNNER_TEMP/l.pem" -out "$RUNNER_TEMP/l.p12" -passout pass:ci
                try "ci" && { OK=1; break; }
              fi
            done
          fi

          [ $OK -eq 1 ] || { echo "ERROR: could not import certificate (bad P12_PASSWORD secret)"; exit 1; }

          security set-key-partition-list -S apple-tool:,apple:,system: -s -k "$KEYCHAIN_PASSWORD" "$KC" >/dev/null 2>&1 || true
          echo "--- identities ---"
          security find-identity -v -p codesigning "$KC"
          echo "KC=$KC" >> $GITHUB_ENV

      - name: Import provisioning profile
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          set -u
          printf '%s' "$MOBILEPROVISION_BASE64" | tr -d '\r\n' | base64 -d > p.mobileprovision 2>/dev/null || true
          if ! security cms -D -i p.mobileprovision >/dev/null 2>&1; then
            echo "ERROR: bad provisioning profile secret"; exit 1
          fi
          UUID=$(security cms -D -i p.mobileprovision | plutil -extract UUID raw -)
          NAME=$(security cms -D -i p.mobileprovision | plutil -extract Name raw -)
          echo "profile: $NAME / $UUID"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp p.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PNAME=$NAME" >> $GITHUB_ENV
          echo "BUNDLE_ID=$(node -p "require('./capacitor.config.json').appId")" >> $GITHUB_ENV

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="$PNAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" 2>&1 | tail -40

      - name: Export IPA
        run: |
          cat > exp.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Development</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PNAME</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist exp.plist 2>&1 | tail -30
          mkdir -p build && cp "$RUNNER_TEMP/export/"*.ipa build/App.ipa && ls -lh build/App.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/App.ipa
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: |
          [ -n "${KC:-}" ] && security delete-keychain "$KC" 2>/dev/null || true
