# Положи в репозиторий как .github/workflows/release.yml
name: Build release APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Установка и синхронизация Capacitor
        run: |
          [ -f package.json ] && npm ci || npm i
          [ -d android ] || npx cap add android
          sh set_package.sh ${{ github.run_number }} 3.0.1
          npx cap sync android
      - name: Сборка release
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Подпись APK
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/release.jks
          APK=$(find android -name '*-release-unsigned.apk' | head -1)
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/zipalign -p 4 "$APK" aligned.apk
          $BT/apksigner sign --ks $RUNNER_TEMP/release.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASS }} --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASS }} --out nomera-rf-release.apk aligned.apk
          $BT/apksigner verify nomera-rf-release.apk
      - uses: actions/upload-artifact@v4
        with: { name: nomera-rf-release, path: nomera-rf-release.apk }
